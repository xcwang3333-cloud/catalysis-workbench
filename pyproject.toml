[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalysis-workbench"
version = "0.6.0"
description = "Quantitative post-processing and publication-quality visualization for catalysis data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "lmfit>=1.3.4",
]

[project.optional-dependencies]
structure = [
  "pymatgen-core>=2026.7.16",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalysis_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
