[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalysis-workbench"
version = "1.0.0"
description = "Reproducible local workbench for catalysis data analysis, workflows, evidence, and publication visualization."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "catalysis",
  "electrocatalysis",
  "scientific-computing",
  "reproducibility",
  "visualization",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "lmfit>=1.3.4",
]

[project.urls]
Homepage = "https://github.com/xcwang3333-cloud/catalysis-workbench"
Repository = "https://github.com/xcwang3333-cloud/catalysis-workbench"
Issues = "https://github.com/xcwang3333-cloud/catalysis-workbench/issues"
Changelog = "https://github.com/xcwang3333-cloud/catalysis-workbench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
structure = [
  "pymatgen-core>=2026.7.16",
]
volumetric3d = [
  "pyvista>=0.48.4,<0.49",
  "vtk>=9.5,<9.7",
]
desktop = [
  "PySide6-Essentials>=6.11.2,<6.12",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalysis_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]