name: Temporary v0.8 Block 5 lint fix

on:
  push:
    branches:
      - feat/v08-block5-operando-xas-xanes
    paths:
      - .github/workflows/v08-block5-lint-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact lint fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/catalysis_workbench/experimental/operando/xas.py")
          text = path.read_text()
          text = text.replace(
              '            "normalized XANES frames must use identical E0/pre-edge/post-edge normalization parameters"\n',
              '            "normalized XANES frames must use identical E0/pre-edge/post-edge "\n'
              '            "normalization parameters"\n',
          )
          text = text.replace(
              '            f"window [{window.start_ev}, {window.end_ev}] eV retains fewer than {min_points} measured points"\n',
              '            f"window [{window.start_ev}, {window.end_ev}] eV retains fewer than "\n'
              '            f"{min_points} measured points"\n',
          )
          text = text.replace(
              '                f"frame {stack.frame_keys[frame_index]!r} has no positive secant slope in the caller window"\n',
              '                f"frame {stack.frame_keys[frame_index]!r} has no positive secant "\n'
              '                "slope in the caller window"\n',
          )
          text = text.replace(
              '                f"frame {stack.frame_keys[frame_index]!r} has an ambiguous equal-maximum edge secant"\n',
              '                f"frame {stack.frame_keys[frame_index]!r} has an ambiguous "\n'
              '                "equal-maximum edge secant"\n',
          )
          path.write_text(text)

          test_path = Path("tests/test_operando_xas.py")
          tests = test_path.read_text()
          tests = tests.replace(
              '    energy = np.array([0.0, 1.0, 2.0, 3.0])\n'
              '    coordinate = FrameCoordinate("time", Axis("time", unit="s"), [0.0])\n\n'
              '    def normalized_result_for',
              '    coordinate = FrameCoordinate("time", Axis("time", unit="s"), [0.0])\n\n'
              '    def normalized_result_for',
          )
          test_path.write_text(tests)
      - name: Commit fixes
        run: |
          git config user.name "xiaochen wang"
          git config user.email "xcwang3333@gmail.com"
          git add src/catalysis_workbench/experimental/operando/xas.py tests/test_operando_xas.py
          git commit -m "fix: satisfy Block 5 lint gate"
          git push
