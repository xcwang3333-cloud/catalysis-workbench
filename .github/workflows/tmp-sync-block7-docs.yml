name: Temporary block-7 docs synchronizer

on:
  push:
    branches:
      - docs/v0.6-block7-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v0.6-block7-sync
      - name: Synchronize exact central-state text
        run: |
          python - <<'PY'
          from pathlib import Path

          master = Path('docs/MASTER_PLAN.md')
          text = master.read_text()
          replacements = {
              '- Active stage: **Issue #172 — synchronize block-6 completion state into central documentation**.\n- v0.6 block 7 (CHE/free-energy thermodynamics) starts only after #172 is complete and `main` is reverified.':
              '- v0.6 block-6 completion-state docs sync: Issue #172 / PR #173 — complete at `9d6d8e2868f38336ba1a8e25adab3fd3b787df1a`.\n- v0.6 block 7, explicit CHE/free-energy thermodynamics: Issue #174 / PR #175 — complete at `e25610d56eb414ac6aedae07874042d3f4edd194`.\n- Block-7 final head `3d008e98281ec95a4f6fd7310db18be97f8a36f3` passed CI #434 / run `32833845931` and final-head reviews `5017464310`, `5017466412` before squash merge.\n- Active stage: **Issue #176 — synchronize block-7 completion state into central documentation**.\n- v0.6 block 8 (free-energy diagrams) starts only after #176 is complete and `main` is reverified.',
              '| v0.6.x | electronic structure and catalysis thermodynamics | architecture + blocks 1–6 complete; block 7 next after #172 |':
              '| v0.6.x | electronic structure and catalysis thermodynamics | architecture + blocks 1–7 complete; block 8 next after #176 |',
              '### Current completion-state sync\n\nIssue #172 is the docs-only synchronization checkpoint after block 6. It records merged reality in central plans without adding CHE/free-energy thermodynamics code. Block 7 begins only after #172 merges and `main` is reverified.':
              '### Block-6 completion-state sync — complete\n\nIssue #172 / PR #173 synchronized the merged block-6 state into central documentation at `9d6d8e2868f38336ba1a8e25adab3fd3b787df1a` before block 7 began.\n\n### CHE / free-energy thermodynamics — complete\n\nIssue #174 / PR #175 delivered explicit thermodynamic entries that reference the reviewed v0.5 `DFTEnergyLedger`, caller-selected free-energy recipes, retained ZPE/thermal/entropy/additional-correction availability and provenance, explicit SHE/RHE Computational Hydrogen Electrode state, and products-positive/reactants-negative reaction free-energy arithmetic. RHE input is explicitly converted to SHE before the common CHE equation so pH cancellation arises algebraically rather than through a hidden special case. No thermochemical database, pathway inference, Pourbaix/microkinetic layer, plotting, or new runtime dependency is introduced.\n\nBlock-7 final head `3d008e98281ec95a4f6fd7310db18be97f8a36f3` passed CI #434 / run `32833845931` and final-head reviews `5017464310`, `5017466412` before squash merge `e25610d56eb414ac6aedae07874042d3f4edd194`.\n\n### Current completion-state sync\n\nIssue #176 is the docs-only synchronization checkpoint after block 7. It records merged reality in central plans without adding free-energy-diagram code. Block 8 begins only after #176 merges and `main` is reverified.',
              '[`DFT_ENERGETICS.md`](DFT_ENERGETICS.md), and [`GEOMETRY_BONDING_CORRELATION.md`](GEOMETRY_BONDING_CORRELATION.md): reviewed domain contracts.':
              '[`DFT_ENERGETICS.md`](DFT_ENERGETICS.md), [`GEOMETRY_BONDING_CORRELATION.md`](GEOMETRY_BONDING_CORRELATION.md), and [`CHE_THERMODYNAMICS.md`](CHE_THERMODYNAMICS.md): reviewed domain contracts.',
              'Issue #172 is the active v0.6 block-6 completion-state documentation checkpoint. After it merges, reverify `main`, Issue #172 closure, immutable `v0.5.0`, immutable `v0.4.0`, distribution/runtime version `0.5.0`, and PyPI-deferred state. Then start block 7 (CHE/free-energy thermodynamics) from that exact verified `main` baseline using the frozen order in `V0_6_PLAN.md`.':
              'Issue #176 is the active v0.6 block-7 completion-state documentation checkpoint. After it merges, reverify `main`, Issue #176 closure, immutable `v0.5.0`, immutable `v0.4.0`, distribution/runtime version `0.5.0`, and PyPI-deferred state. Then start block 8 (free-energy diagrams) from that exact verified `main` baseline using the frozen order in `V0_6_PLAN.md`.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'MASTER_PLAN replacement target missing: {old[:80]}')
              text = text.replace(old, new, 1)
          master.write_text(text)

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          replacements = {
              'CHE/free-energy thermodynamics, free-energy diagrams, charge-density difference and VASP job management remain v0.6+ work; DOS/PDOS, Bader, COHP/ICOHP, and geometry–bonding correlation scientific blocks are now complete in v0.6.':
              'Free-energy diagrams, charge-density difference and VASP job management remain v0.6+ work; DOS/PDOS, Bader, COHP/ICOHP, geometry–bonding correlation, and CHE/free-energy thermodynamics scientific blocks are now complete in v0.6.',
              'scientific block 6 is complete through Issue #170 / PR #171 at merge `f66bcae9bd254cf3abe12e8f161b0a38080c7ad3`. Issue #172 is the current docs-only completion-state synchronization before block 7 begins.':
              'scientific block 6 is complete through Issue #170 / PR #171 at merge `f66bcae9bd254cf3abe12e8f161b0a38080c7ad3`, block-6 completion-state synchronization #172 / #173 is complete at `9d6d8e2868f38336ba1a8e25adab3fd3b787df1a`, and scientific block 7 is complete through Issue #174 / PR #175 at merge `e25610d56eb414ac6aedae07874042d3f4edd194`. Issue #176 is the current docs-only completion-state synchronization before block 8 begins.',
              '7. **CHE / free-energy thermodynamics — next after #172; not yet implemented.**\n8. **Free-energy diagrams.**':
              '7. **CHE / free-energy thermodynamics — complete through #174 / #175.**\n   - explicit thermodynamic correction/availability state on top of the reviewed DFT ledger; caller-selected free-energy recipes; explicit SHE/RHE CHE conversion and pH/potential contributions; products-positive/reactants-negative reaction free-energy arithmetic; no hidden thermochemical lookup, chemistry/pathway inference, or plotting.\n8. **Free-energy diagrams — next after #176; not yet implemented.**'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'ROADMAP replacement target missing: {old[:80]}')
              text = text.replace(old, new, 1)
          roadmap.write_text(text)
          PY
          git diff --check
          git diff -- docs/MASTER_PLAN.md docs/ROADMAP.md
      - name: Commit exact docs synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MASTER_PLAN.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record v0.6 block-7 completion state"
          git push origin HEAD:docs/v0.6-block7-sync
