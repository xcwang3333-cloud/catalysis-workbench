name: Temporary v0.8 Block 2 docs sync

on:
  push:
    branches:
      - docs/v08-block2-completion-sync

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v08-block2-completion-sync
          fetch-depth: 0

      - name: Synchronize verified Block 2 completion state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # README: public capability and active-development state.
          replace_once(
              "README.md",
              "- Operando/time-resolved: v0.8 Block 1 is implemented on `main` as a shared immutable frame-coordinate / exact-grid stack foundation with explicit provenance and reconstruction digests; technique-specific adapters, derived operations, and passive waterfall/heatmap visualization remain later v0.8 blocks.",
              "- Operando/time-resolved: v0.8 Blocks 1-2 are implemented on `main`: the shared immutable frame-coordinate / exact-grid stack foundation is joined by exact measured-point frame/signal operations, immutable derived traces, fail-closed exact cross-modal trace pairing, and explicit Pearson correlation with retained provenance; passive waterfall/heatmap/cut/trace visualization and technique-specific Raman/IR, XAS, and XRD adapters remain later v0.8 blocks."
          )
          replace_once(
              "README.md",
              "Block 2 — exact measured-point operations, derived traces, and explicit cross-modal comparison — is the next implementation work package.",
              "Block 2 completed through Issue #257 / PR #258: final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`, formal review 1's fail-closed result-state blocker was fixed and regression-tested, formal review 2 `5026418909` found no blockers with zero unresolved threads, expected-head squash merge produced `86cd463e288eca08c7917945fafbf630493ede92`, and post-merge main CI #581 / run `32925811342` passed. Block 3 — passive waterfall, heatmap, cut, and trace visualization — is the next implementation work package."
          )
          replace_once(
              "README.md",
              "- **v0.8:** architecture frozen for operando/time-resolved Raman/IR, XAS, and XRD stacks, waterfalls, heatmaps, descriptor trajectories, and explicit cross-modal correlation; Block 1 shared immutable stack foundation is complete, with five implementation blocks remaining.",
              "- **v0.8:** architecture frozen for operando/time-resolved Raman/IR, XAS, and XRD stacks, waterfalls, heatmaps, descriptor trajectories, and explicit cross-modal correlation; Blocks 1-2 are complete, with four implementation blocks remaining and Block 3 passive visualization next."
          )

          # MASTER_PLAN: live checkpoint, v0.8 evidence, release map, and handoff.
          replace_once(
              "docs/MASTER_PLAN.md",
              "- Current verified implementation head: `45d0515dd5c1c70f15f4d5cd76ba2a359dc66bb2`, the expected-head squash merge of v0.8 Block 1 through Issue #253 / PR #254; post-merge CI #562 / run `32922349620` passed on that exact `main` head.",
              "- Current verified scientific implementation merge: `86cd463e288eca08c7917945fafbf630493ede92`, the expected-head squash merge of v0.8 Block 2 through Issue #257 / PR #258; post-merge CI #581 / run `32925811342` passed on that exact merge head. Current `main` `38e512d9b591c69a85b1664a604d3700ba0da945` has the same source tree after an accidental `noop` add/remove pair."
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "- v0.8 Block 2 — exact measured-point operations, derived traces, and explicit cross-modal comparison — is the next scientific implementation work package. No v0.7.1, tag, release, or package-registry action is implied.",
              "- v0.8 Block 2 exact measured-point operations, immutable derived traces, fail-closed exact cross-modal comparison, and explicit Pearson correlation are complete through Issue #257 / PR #258 at merge `86cd463e288eca08c7917945fafbf630493ede92`; final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`, the review-1 fail-closed constructor blocker was fixed and regression-tested, formal review 2 `5026418909` found no blockers with zero unresolved threads, and post-merge main CI #581 / run `32925811342` passed. Block 3 — passive waterfall, heatmap, cut, and trace visualization — is next. No v0.7.1, tag, release, or package-registry action is implied."
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "| v0.8.x | operando/time-resolved analysis | architecture frozen; Block 1 complete; Block 2 next |",
              "| v0.8.x | operando/time-resolved analysis | architecture frozen; Blocks 1-2 complete; Block 3 passive visualization next |"
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "No new runtime dependency, hidden alignment/interpolation/normalization, automatic peak/species/phase inference, v0.7.1, tag, release, or package-registry action was introduced. Block 2 — exact measured-point operations, derived traces, and explicit cross-modal comparison — is next.",
              "Block 2 adds exact frame selection by retained keys/indices and explicit frame-coordinate comparison, measured-point signal cropping, exact frame/signal-position cuts, immutable derived `OperandoTrace` state, fail-closed exact `TracePair` compatibility, and ordinary Pearson correlation computed from the retained pair. It preserves acquisition order and measured coordinates/values, rejects hidden intersection/alignment/interpolation/nearest-neighbor matching, and carries no causal interpretation. Final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`; expected-head squash merge produced `86cd463e288eca08c7917945fafbf630493ede92`; post-merge main CI #581 / run `32925811342` passed.\n\nNo new runtime dependency, hidden alignment/interpolation/normalization, automatic peak/species/phase inference, v0.7.1, tag, release, or package-registry action was introduced. Block 3 — passive waterfall, heatmap, cut, and trace visualization — is next."
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "The v0.7 release lifecycle and post-release central-state correction are complete. The dedicated v0.8 architecture checkpoint is complete through Issue #249 / PR #250, and shared-stack foundation Block 1 is complete through Issue #253 / PR #254 at `45d0515dd5c1c70f15f4d5cd76ba2a359dc66bb2`; begin Block 2 — exact measured-point operations, derived traces, and explicit cross-modal comparison — from a new scoped Issue and Draft PR, then continue the frozen order in `V0_8_PLAN.md`. Preserve immutable `v0.7.0 -> e3062fc12c794f54c7b7613875ec73608a587a59`, distribution/runtime release version `0.7.0`, the published public GitHub Release, and the PyPI-deferred boundary.",
              "The v0.7 release lifecycle and post-release central-state correction are complete. The dedicated v0.8 architecture checkpoint is complete through Issue #249 / PR #250, shared-stack foundation Block 1 is complete through Issue #253 / PR #254 at `45d0515dd5c1c70f15f4d5cd76ba2a359dc66bb2`, and exact measured-point/derived-trace/comparison Block 2 is complete through Issue #257 / PR #258 at `86cd463e288eca08c7917945fafbf630493ede92`; begin Block 3 — passive waterfall, heatmap, cut, and trace visualization — from a new scoped Issue and Draft PR, then continue the frozen order in `V0_8_PLAN.md`. Preserve immutable `v0.7.0 -> e3062fc12c794f54c7b7613875ec73608a587a59`, distribution/runtime release version `0.7.0`, the published public GitHub Release, and the PyPI-deferred boundary."
          )

          # ROADMAP: block completion and frozen-order handoff.
          replace_once(
              "docs/ROADMAP.md",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Block 1 complete",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Blocks 1-2 complete"
          )
          replace_once(
              "docs/ROADMAP.md",
              "The six-block architecture is frozen in [`V0_8_PLAN.md`](V0_8_PLAN.md) through Issue #249 / PR #250 at `fa7baaf8ce68369b0e732faf4e7621a818db92b6`; post-merge CI #550 / run `32920821932` passed. Block 1 is complete through Issue #253 / PR #254 at expected-head squash merge `45d0515dd5c1c70f15f4d5cd76ba2a359dc66bb2`; final head `eadf5b2e6630b137922f365a88f4b9ef3c43b12b` passed CI #561 / run `32922150384` and formal reviews `5026150379`, `5026170031`, and post-merge main CI #562 / run `32922349620` passed on the merge commit.",
              "The six-block architecture is frozen in [`V0_8_PLAN.md`](V0_8_PLAN.md) through Issue #249 / PR #250 at `fa7baaf8ce68369b0e732faf4e7621a818db92b6`; post-merge CI #550 / run `32920821932` passed. Block 1 is complete through Issue #253 / PR #254 at expected-head squash merge `45d0515dd5c1c70f15f4d5cd76ba2a359dc66bb2`; final head `eadf5b2e6630b137922f365a88f4b9ef3c43b12b` passed CI #561 / run `32922150384` and formal reviews `5026150379`, `5026170031`, and post-merge main CI #562 / run `32922349620` passed on the merge commit. Block 2 is complete through Issue #257 / PR #258 at expected-head squash merge `86cd463e288eca08c7917945fafbf630493ede92`; final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`, the review-1 fail-closed result-state blocker was fixed and regression-tested, formal review 2 `5026418909` found no blockers with zero unresolved threads, and post-merge main CI #581 / run `32925811342` passed."
          )
          replace_once(
              "docs/ROADMAP.md",
              "2. Exact measured-point operations, derived traces, and explicit cross-modal comparison.",
              "2. **Exact measured-point operations, derived traces, and explicit cross-modal comparison — complete through #257 / #258.**\n   - exact retained-key/index and explicit coordinate-comparison frame selection without sorting or automatic coordinate choice;\n   - measured-point signal cropping plus exact frame/signal-position cuts with no synthesized values or nearest-neighbor lookup;\n   - immutable derived traces, fail-closed exact trace pairing, and explicit ordinary Pearson correlation with retained coefficient, two-sided p-value, paired values, and provenance."
          )
          replace_once(
              "docs/ROADMAP.md",
              "The frozen contract requires literal common grids, explicit coordinates/units/provenance, retained acquisition order, passive renderers, and fail-closed incompatibility. It performs no hidden alignment, interpolation, smoothing, baseline correction, normalization, chemical assignment, XAS species inference, XRD phase inference, or causal interpretation. Block 2 — exact measured-point operations, derived traces, and explicit cross-modal comparison — is the next implementation work package.",
              "The frozen contract requires literal common grids, explicit coordinates/units/provenance, retained acquisition order, passive renderers, and fail-closed incompatibility. It performs no hidden alignment, interpolation, smoothing, baseline correction, normalization, chemical assignment, XAS species inference, XRD phase inference, or causal interpretation. Block 3 — passive waterfall, heatmap, cut, and trace visualization — is the next implementation work package."
          )
          PY

          rm -f docs/.v08-block2-completion-sync
          rm -f .github/workflows/docs-v08-block2-sync-temp.yml

          git diff --check
          git diff -- README.md docs/MASTER_PLAN.md docs/ROADMAP.md
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MASTER_PLAN.md docs/ROADMAP.md docs/.v08-block2-completion-sync .github/workflows/docs-v08-block2-sync-temp.yml
          git commit -m "docs: synchronize v0.8 Block 2 completion state"
          git push origin HEAD:docs/v08-block2-completion-sync
