          # CatalysisWorkbench v1.1 Release Procedure

          This document defines the release-maturity process for the reviewed v1.1 task-first workbench. GitHub is the operational source of truth. Every gate is bound to its exact head; evidence from an older head becomes stale after any change.

          ## Frozen implementation baseline

          - v1.1 Blocks 1–6: complete and merged;
          - Block-6 PR: #305;
          - Block-6 squash merge / Gate-A exact baseline: `{BASE}`;
          - Block-6 post-merge CI: #851 — 4/4 jobs success;
          - Block-6 post-merge Stable 1.0 Readiness: #113 — 8/8 jobs success;
          - current candidate development version: `1.1.0.dev0`;
          - project license: `BSD-3-Clause`;
          - retained stable release before v1.1: `v1.0.0 -> 22b944992bfd3791f91cc951f89eb22e8bf47325`;
          - Gate-A branch: `release/v1.1.0-gate-a`.

          Gate A creates release-readiness evidence only. It does not finalize the version or publish any artifact.

          ## Gate A — Stable 1.1 release hardening — in progress

          Gate A retains `1.1.0.dev0` and owns only release validation/documentation:

          - a unified Stable 1.1 installed-wheel audit that first re-runs the frozen Stable 1.0 audit and then all reviewed v1.1 headless installed smokes;
          - explicit verification of the `catalysis-workbench` console entry point and Qt-free `--version` path;
          - exact-wheel isolated base and `[desktop]` installs on Linux, Windows and macOS;
          - Python 3.11 and 3.14 platform validation;
          - exact wheel/sdist naming, metadata validation, and sdist-to-wheel rebuild;
          - continued ordinary CI, including the full v1.1 offscreen desktop dogfood journeys;
          - release procedure and draft release-note synchronization;
          - no scientific, workflow, workspace, application, desktop-semantic, dependency, public-API, schema, or version change.

          ### Gate A evidence

          | Evidence | State |
          | --- | --- |
          | exact base | `{BASE}` |
          | candidate version | `1.1.0.dev0` |
          | final Gate-A head | pending |
          | exact-head ordinary CI | pending |
          | exact-head Stable 1.0 Readiness | pending |
          | exact-head Stable 1.1 Readiness | pending |
          | formal release/API/packaging review | pending |
          | unresolved review threads | pending |
          | merge gate | pending |
          | squash merge / Gate-B baseline | pending |

          Ready status never authorizes merge. Gate A must be squash-merged only after a separate explicit merge authorization and expected-head verification.

          ## Gate B — final-version candidate

          Gate B may start only from the exact post-merge Gate-A main after all Gate-A push workflows are green.

          Gate B owns mechanical final-version synchronization only:

          - `[project].version`: `1.1.0.dev0` -> `1.1.0`;
          - runtime `__version__`: `1.1.0.dev0` -> `1.1.0`;
          - ordinary CI and both release-readiness workflows' expected-version checks -> exact `1.1.0`;
          - exact wheel/sdist artifact names -> final `1.1.0` names;
          - version-sensitive installed-smoke and workflow-evidence assertions -> `1.1.0`;
          - release-status documentation -> final candidate;
          - no feature, scientific, dependency, schema, public-API, or runtime-semantic change.

          The exact Gate-B head must pass ordinary CI, Stable 1.0 Readiness, and Stable 1.1 Readiness before final review.

          ## Gate C — immutable tag

          Creating `v1.1.0` is allowed only after Gate B is merged and its exact reviewed release commit passes post-merge validation. The tag target must be specified as an immutable commit SHA and reverse-verified after creation. A tag must never be moved or recreated as a side effect of another gate.

          ## GitHub Release publication

          A GitHub Release may be published only from an already verified `v1.1.0` tag. Release notes must describe only behavior present in that tagged commit. Release publication does not imply package-registry publication.

          ## Installer/distribution packaging

          Native installers or additional distribution bundles are optional and separate from the Python wheel/sdist release evidence. They require a separately reviewed packaging design, signing/provenance plan, platform matrix, and artifact-verification gate before publication.

          ## PyPI/package-registry publication

          Registry publication is a separate operation after the final tag is verified. Package-name availability, credentials or trusted-publishing configuration, provenance, exact artifact hashes, and the intended registry target must be re-checked immediately before upload. Building artifacts never authorizes uploading them.

          ## Mandatory evidence discipline

          For every v1.1 release gate:

          1. record exact base and exact head;
          2. invalidate CI/review evidence from older heads after any change;
          3. require ordinary CI plus both Stable 1.0 and Stable 1.1 readiness on the exact candidate;
          4. require unresolved review threads = 0;
          5. preserve scientific/API/dependency/version/tag/publication boundaries;
          6. use expected-head squash merge only after separate merge authorization;
          7. re-read `main` after merge and validate post-merge push workflows;
          8. treat final-version synchronization, tag creation, GitHub Release, installers, and registry publication as distinct gates.
          '''), encoding="utf-8")

          Path("docs/V1_1_RELEASE_NOTES_DRAFT.md").write_text(dedent('''\
          # CatalysisWorkbench v1.1 Release Notes — Draft

          These notes describe the reviewed v1.1 release-candidate scope. During Gate A the distribution/runtime identity remains `1.1.0.dev0`; final `1.1.0`, the `v1.1.0` tag, GitHub Release, installers, and registry publication remain later gates.

          ## Overview

          CatalysisWorkbench v1.1 redesigns the optional desktop around a task-first research workflow while retaining the reviewed v1.0 scientific, workflow, provenance, workspace, and compatibility contracts.

          The ordinary-user path is:

          ```text
          Home
            -> choose LSV / FE & Partial Current / Generic XY
            -> Data Intake & Mapping
            -> Live Scientific Analysis
            -> Figure Workbench
            -> Figure Package Export
          ```

          Projects remain local and explicit. Scientific transformations stay reviewable, deterministic where specified, and fail closed on incompatible state.

          ## Task-first project lifecycle

          v1.1 adds a deterministic `AnalysisDocument` / `AnalysisSession` path alongside the retained v1.0 application compatibility surface. A task starts as a clean in-memory analysis; no project directory is created until an explicit Save Project action succeeds.

          Saved v1.1 projects retain `workspace.json` plus `project.json`, deterministic document identities, explicit dirty/undo/redo behavior, concurrency checks, atomic control-file replacement, and fail-closed open/save semantics.

          ## Data intake and mapping

          The reviewed desktop intake path supports `.csv`, `.txt`, `.tsv`, `.dat`, `.xlsx`, and `.xlsm` with bounded preview and explicit scientific X/Y mapping.

          Raw byte identity, parser/mapping state, and scientific input identity are separated. Saved projects take verified ownership of raw copies. File paths do not become scientific identity, and the desktop does not recursively crawl directories or infer chemistry as authority.

          ## Live scientific analysis

          The three v1.1 task families provide explicit reviewed processing:

          - **LSV / Polarization:** explicit reference/RHE handling, iR correction, optional geometric-area normalization, output current-density unit, and scientific analysis range;
          - **FE & Partial Current:** explicit current-series to FE-series pairing, compatible x-grid requirement, reviewed signed partial-current calculation, and independent FE/partial-current result views; and
          - **Generic XY:** explicit scientific analysis-range cropping only.

          Invalid processing drafts do not mutate committed scientific state. Hidden interpolation, resampling, nearest-match alignment, smoothing, baseline correction, fitting, normalization, automatic FE/current pairing, and silent scientific repair are not introduced.

          ## Figure Workbench

          v1.1 adds presentation-only `FigureDraft` state bound to exact scientific trace identities. Users can control trace selection/order/labels, publication preset, physical figure size, axes/display ranges, legend, typography, lines, and markers without mutating scientific arrays or run identities.

          Scientific analysis ranges and Figure display ranges remain separate. Stale figures are explicit and never silently refreshed.

          ## Figure Package export

          Figure Packages export selected SVG/PDF/PNG figures together with full scientific source data in XLSX/TXT form. Packages retain path-independent semantic identity, exact file hashes, project/workspace provenance, and fail-closed staging/publication/rollback behavior.

          Display limits do not crop the exported scientific source arrays. Existing destinations are not silently overwritten, merged, or auto-suffixed.

          ## Dogfooding hardening and desktop cleanup

          The final v1.1 development block adds:

          - complete fresh-wheel/offscreen Generic XY, LSV, and FE & Partial Current journeys from real files through package export and project reopen verification;
          - explicit Save Project from export preflight;
          - post-export Open Folder and Export Another actions;
          - actionable ordinary-language errors with exact original exception text retained as technical details;
          - presentation-only Recent Projects caching that avoids needless disk reopens;
          - a normal-user `catalysis-workbench` command;
          - explicit `--project PATH` launch into the v1.1 project path; and
          - a Qt-free `--version` path that works from the base wheel.

          ## Compatibility and release hardening

          Stable v1.0 public/application/workspace/desktop compatibility remains an active regression gate.

          Stable 1.1 Gate A adds:

          - a unified exact-wheel audit covering the frozen Stable 1.0 audit plus all reviewed v1.1 headless installed smokes;
          - console-entry-point and Qt-free version verification;
          - Linux/Windows/macOS isolated base and `[desktop]` installs on Python 3.11 and 3.14;
          - exact wheel/sdist metadata and naming checks; and
          - sdist-to-wheel rebuild validation.

          The project remains BSD-3-Clause. The base package remains independent of optional Qt, pymatgen, PyVista, and VTK backends until those extras are explicitly used.

          ## Intentional non-goals

          v1.1 does not add automatic chemistry/species/phase assignment, recursive project discovery, hidden scientific cleaning, workflow DAG inference, arbitrary serialized callable execution, database/server/cloud collaboration, background file watchers, automatic stale-Figure refresh, or implicit package overwrite/merge.

          ## Release status

          Gate A retains `1.1.0.dev0` while proving release readiness. Gate B will separately synchronize the exact reviewed candidate to `1.1.0`. Tagging, GitHub Release publication, installers, and package-registry publication occur only after their own verification gates.
          '''), encoding="utf-8")

