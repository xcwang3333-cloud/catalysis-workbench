name: Temporary v0.8 Block 5 exact normalization fixture

on:
  push:
    branches:
      - feat/v08-block5-operando-xas-xanes
    paths:
      - .github/workflows/v08-block5-test-orders-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use exact constant normalization in edge fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_operando_xas.py")
          text = path.read_text()
          old = "                1,\n                1,\n"
          new = "                0,\n                0,\n"
          index = text.rfind(old)
          if index < 0:
              raise SystemExit("expected edge normalization orders not found")
          path.write_text(text[:index] + new + text[index + len(old):])
      - name: Commit deterministic normalization fixture
        run: |
          git config user.name "xiaochen wang"
          git config user.email "xcwang3333@gmail.com"
          git add tests/test_operando_xas.py
          git commit -m "test: use exact Block 5 normalization fixture"
          git push
