name: Temporary block-9 integral naming fixer

on:
  push:
    branches:
      - feat/v0.6-charge-density-difference

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6-charge-density-difference
      - name: Apply exact reviewed naming fix
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/catalysis_workbench/computation/charge_density_difference.py'): [
                  ('def integrated_difference_electrons(self) -> float:', 'def integrated_difference(self) -> float:'),
                  ('"integrated_difference_electrons": result.integrated_difference_electrons,', '"integrated_difference": result.integrated_difference,'),
              ],
              Path('tests/test_charge_density_difference.py'): [
                  ('result.integrated_difference_electrons', 'result.integrated_difference'),
              ],
              Path('tests/installed_charge_density_difference_smoke.py'): [
                  ('result.integrated_difference_electrons', 'result.integrated_difference'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing replacement target in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git diff --check
      - name: Commit reviewed naming fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalysis_workbench/computation/charge_density_difference.py tests/test_charge_density_difference.py tests/installed_charge_density_difference_smoke.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: use component-neutral integrated difference name"
          git push origin HEAD:feat/v0.6-charge-density-difference
