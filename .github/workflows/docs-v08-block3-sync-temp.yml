name: Temporary v0.8 Block 3 docs sync

on:
  push:
    branches: [docs/v08-block3-completion-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v08-block3-completion-sync
      - name: Synchronize exact central status strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # README
          replace_once(
              "README.md",
              "- Operando/time-resolved: v0.8 Blocks 1-2 are implemented on `main`: the shared immutable frame-coordinate / exact-grid stack foundation is joined by exact measured-point frame/signal operations, immutable derived traces, fail-closed exact cross-modal trace pairing, and explicit Pearson correlation with retained provenance; passive waterfall/heatmap/cut/trace visualization and technique-specific Raman/IR, XAS, and XRD adapters remain later v0.8 blocks.",
              "- Operando/time-resolved: v0.8 Blocks 1-3 are implemented on `main`: the shared immutable frame-coordinate / exact-grid stack foundation and exact measured-point/derived-trace/cross-modal comparison layer are joined by passive waterfall, heatmap, frame-cut, and trace visualization with exact retained scientific state, explicit ordinal/coordinate frame geometry, explicit value limits, and display-only offsets/reversal; technique-specific Raman/IR, XAS, and XRD adapters remain later v0.8 blocks.",
          )
          replace_once(
              "README.md",
              "The shared visualization layer provides publication-ready curve, scatter, categorical bar, XAS/EXAFS map, static structure, relative-energy, DOS/PDOS, free-energy-diagram, band/fat-band, work-function, NEB-barrier, exact scalar-field slice, and optional static volumetric 3-D rendering with adjustable figure/axes geometry, typography, lines/markers, ticks, legends, annotations, limits, presets, explicit errors where supplied, stable-key styling, explicit symmetric zero-centered color limits, and exact-size export. Scientific renderers remain passive consumers of reviewed retained state. Operando/time-resolved waterfall and heatmap visualization remains a later v0.8 block, while interactive editing remains later scope.",
              "The shared visualization layer provides publication-ready curve, scatter, categorical bar, XAS/EXAFS map, static structure, relative-energy, DOS/PDOS, free-energy-diagram, band/fat-band, work-function, NEB-barrier, exact scalar-field slice, optional static volumetric 3-D rendering, and v0.8 passive operando waterfall/heatmap/cut/trace rendering with adjustable figure/axes geometry, typography, lines/markers, ticks, legends, annotations, limits, presets, explicit errors where supplied, stable-key styling, explicit symmetric zero-centered color limits, and exact-size export. Scientific renderers remain passive consumers of reviewed retained state; operando heatmaps use caller-selected ordinal or strictly monotonic coordinate display geometry without resampling. Interactive editing remains later scope.",
          )
          old = "Block 2 completed through Issue #257 / PR #258: final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`, formal review 1's fail-closed result-state blocker was fixed and regression-tested, formal review 2 `5026418909` found no blockers with zero unresolved threads, expected-head squash merge produced `86cd463e288eca08c7917945fafbf630493ede92`, and post-merge main CI #581 / run `32925811342` passed. Block 3 — passive waterfall, heatmap, cut, and trace visualization — is the next implementation work package."
          new = "Block 2 completed through Issue #257 / PR #258: final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`, formal review 1's fail-closed result-state blocker was fixed and regression-tested, formal review 2 `5026418909` found no blockers with zero unresolved threads, expected-head squash merge produced `86cd463e288eca08c7917945fafbf630493ede92`, and post-merge main CI #581 / run `32925811342` passed. Block 3 completed through Issue #263 / PR #264: final exact head `37c69c18e3e81bd228eadf3c4c2e3b5b8540a8a1` passed CI #594 / run `32927718634` with Ruff, all 1157 tests, fresh-wheel Block-3 audit, and volumetric3d smoke; formal reviews `5026595721`, `5026596493` found no blockers with zero unresolved threads; expected-head squash merge produced `4a5b5ee0f75321dbf3a679ab616ac69972e34575`, and post-merge main CI #595 / run `32928011235` passed. Block 4 — operando Raman and FTIR adapters with caller-specified band/peak trajectories — is the next implementation work package."
