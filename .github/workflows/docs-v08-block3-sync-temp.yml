          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "The v0.7 release lifecycle and post-release central-state correction are complete. The dedicated v0.8 architecture checkpoint is complete through Issue #249 / PR #250, shared-stack foundation Block 1 is complete through Issue #253 / PR #254 at `45d0515dd5c1c70f15f4d5cd76ba2a359dc66bb2`, and exact measured-point/derived-trace/comparison Block 2 is complete through Issue #257 / PR #258 at `86cd463e288eca08c7917945fafbf630493ede92`; begin Block 3 — passive waterfall, heatmap, cut, and trace visualization — from a new scoped Issue and Draft PR, then continue the frozen order in `V0_8_PLAN.md`. Preserve immutable `v0.7.0 -> e3062fc12c794f54c7b7613875ec73608a587a59`, distribution/runtime release version `0.7.0`, the published public GitHub Release, and the PyPI-deferred boundary.",
              "The v0.7 release lifecycle and post-release central-state correction are complete. The dedicated v0.8 architecture checkpoint is complete through Issue #249 / PR #250; Blocks 1, 2, and 3 are complete through Issue/PR pairs #253/#254, #257/#258, and #263/#264 respectively, with Block 3 merged at `4a5b5ee0f75321dbf3a679ab616ac69972e34575`; begin Block 4 — operando Raman and FTIR adapters with caller-specified band/peak trajectories — from a new scoped Issue and Draft PR, then continue the frozen order in `V0_8_PLAN.md`. Preserve immutable `v0.7.0 -> e3062fc12c794f54c7b7613875ec73608a587a59`, distribution/runtime release version `0.7.0`, the published public GitHub Release, and the PyPI-deferred boundary.",
          )

          # ROADMAP
          replace_once(
              "docs/ROADMAP.md",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Blocks 1-2 complete",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Blocks 1-3 complete",
          )
          replace_once(
              "docs/ROADMAP.md",
              "Block 2 is complete through Issue #257 / PR #258 at expected-head squash merge `86cd463e288eca08c7917945fafbf630493ede92`; final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`, the review-1 fail-closed result-state blocker was fixed and regression-tested, formal review 2 `5026418909` found no blockers with zero unresolved threads, and post-merge main CI #581 / run `32925811342` passed.",
              "Block 2 is complete through Issue #257 / PR #258 at expected-head squash merge `86cd463e288eca08c7917945fafbf630493ede92`; final exact head `9fc8e372f15015de1d65705cedd0ad68414613b7` passed CI #580 / run `32925586441`, the review-1 fail-closed result-state blocker was fixed and regression-tested, formal review 2 `5026418909` found no blockers with zero unresolved threads, and post-merge main CI #581 / run `32925811342` passed. Block 3 is complete through Issue #263 / PR #264 at expected-head squash merge `4a5b5ee0f75321dbf3a679ab616ac69972e34575`; final exact head `37c69c18e3e81bd228eadf3c4c2e3b5b8540a8a1` passed CI #594 / run `32927718634`, formal reviews `5026595721`, `5026596493` found no blockers with zero unresolved threads, and post-merge main CI #595 / run `32928011235` passed.",
          )
          replace_once(
              "docs/ROADMAP.md",
              "3. Passive waterfall, heatmap, cut, and trace visualization.",
              "3. **Passive waterfall, heatmap, cut, and trace visualization — complete through #263 / #264.**\n   - exact retained frames/matrices/traces are rendered without scientific recalculation; waterfall offsets and axis reversal are display-only; ordinal heatmaps preserve repeated/non-monotonic selected coordinates in retained order, while coordinate heatmaps require unique strictly monotonic retained coordinates and fail closed rather than sorting/deduplicating; explicit value limits/colormap and optional caller-requested `symmetric_color_limits()` preserve the no-hidden-range contract; fresh-wheel Block-3 and exact-size export coverage are verified.",
          )
