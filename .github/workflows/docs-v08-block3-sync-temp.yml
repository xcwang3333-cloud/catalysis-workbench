              "docs/ROADMAP.md",
              "The frozen contract requires literal common grids, explicit coordinates/units/provenance, retained acquisition order, passive renderers, and fail-closed incompatibility. It performs no hidden alignment, interpolation, smoothing, baseline correction, normalization, chemical assignment, XAS species inference, XRD phase inference, or causal interpretation. Block 3 — passive waterfall, heatmap, cut, and trace visualization — is the next implementation work package.",
              "The frozen contract requires literal common grids, explicit coordinates/units/provenance, retained acquisition order, passive renderers, and fail-closed incompatibility. It performs no hidden alignment, interpolation, smoothing, baseline correction, normalization, chemical assignment, XAS species inference, XRD phase inference, or causal interpretation. Block 4 — operando Raman and FTIR adapters with caller-specified band/peak trajectories — is the next implementation work package.",
          )
          PY
          rm docs/.v08-block3-sync
          rm .github/workflows/docs-v08-block3-sync-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MASTER_PLAN.md docs/ROADMAP.md docs/.v08-block3-sync .github/workflows/docs-v08-block3-sync-temp.yml
          git diff --cached --check
          git commit -m "docs: synchronize v0.8 Block 3 completion state"
          git push
