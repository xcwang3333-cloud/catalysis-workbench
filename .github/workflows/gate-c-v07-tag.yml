name: v0.7 Gate C tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-c-v07-tag.yml"

permissions:
  contents: write

jobs:
  create-and-verify-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and reverse-verify v0.7.0 tag
        shell: bash
        run: |
          set -euo pipefail

          target="e3062fc12c794f54c7b7613875ec73608a587a59"
          tag="v0.7.0"
          prior_tag="v0.6.0"
          prior_target="c7793b309f41d174c14534bd6d4acdacc2a57636"

          git fetch --force --tags origin
          git cat-file -e "${target}^{commit}"

          git show "${target}:pyproject.toml" > /tmp/cw-pyproject.toml
          git show "${target}:src/catalysis_workbench/__init__.py" > /tmp/cw-init.py

          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          with Path("/tmp/cw-pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          runtime_text = Path("/tmp/cw-init.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"\s*$', runtime_text, re.MULTILINE)
          if match is None:
              raise SystemExit("runtime __version__ not found")
          runtime_version = match.group(1)
          if project_version != "0.7.0" or runtime_version != "0.7.0":
              raise SystemExit(
                  f"release target version mismatch: project={project_version}, runtime={runtime_version}"
              )
          print(f"release target versions verified: {project_version}")
          PY

          prior_remote="$(git ls-remote --tags origin "refs/tags/${prior_tag}" | awk '{print $1}')"
          if [[ "${prior_remote}" != "${prior_target}" ]]; then
            echo "prior tag invariant failed: ${prior_tag} -> ${prior_remote:-<missing>}" >&2
            exit 1
          fi

          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ -n "${existing}" ]]; then
            if [[ "${existing}" != "${target}" ]]; then
              echo "refusing to move existing ${tag}: ${existing} != ${target}" >&2
              exit 1
            fi
            echo "${tag} already exists at authorized target; no mutation needed"
          else
            git tag "${tag}" "${target}"
            git push origin "refs/tags/${tag}"
          fi

          verified="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [[ "${verified}" != "${target}" ]]; then
            echo "tag reverse verification failed: ${tag} -> ${verified:-<missing>}" >&2
            exit 1
          fi

          echo "verified ${tag} -> ${verified}"
          echo "verified ${prior_tag} -> ${prior_remote}"
