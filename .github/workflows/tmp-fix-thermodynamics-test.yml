name: Temporary thermodynamics test formatter

on:
  push:
    branches:
      - feat/v0.6-che-free-energy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6-che-free-energy
      - name: Wrap two long parametrization lines
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_thermodynamics.py')
          text = path.read_text()
          text = text.replace(
              '        {"temperature_k": 298.15, "ph": float("nan"), "potential_v": 0.0, "potential_reference": "SHE"},',
              '        {\n            "temperature_k": 298.15,\n            "ph": float("nan"),\n            "potential_v": 0.0,\n            "potential_reference": "SHE",\n        },',
          )
          text = text.replace(
              '        {"temperature_k": 298.15, "ph": 0.0, "potential_v": float("inf"), "potential_reference": "SHE"},',
              '        {\n            "temperature_k": 298.15,\n            "ph": 0.0,\n            "potential_v": float("inf"),\n            "potential_reference": "SHE",\n        },',
          )
          path.write_text(text)
          PY
          git diff --check
          git diff -- tests/test_thermodynamics.py
      - name: Commit exact formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_thermodynamics.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: wrap thermodynamics test parameters"
          git push origin HEAD:feat/v0.6-che-free-energy
