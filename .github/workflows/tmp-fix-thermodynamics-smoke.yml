name: Temporary thermodynamics smoke fixer

on:
  push:
    branches:
      - feat/v0.6-che-free-energy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6-che-free-energy
      - name: Add missing public API smoke import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/installed_thermodynamics_smoke.py')
          text = path.read_text()
          text = text.replace(
              '    FreeEnergyCorrection,\n    FreeEnergyEvaluation,',
              '    FreeEnergyContribution,\n    FreeEnergyCorrection,\n    FreeEnergyEvaluation,',
          )
          text = text.replace(
              'assert ThermodynamicsError is not None\n',
              'assert ThermodynamicsError is not None\nassert FreeEnergyContribution is not None\n',
          )
          path.write_text(text)
          PY
          git diff --check
          git diff -- tests/installed_thermodynamics_smoke.py
      - name: Commit exact smoke fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/installed_thermodynamics_smoke.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: smoke all thermodynamics public result state"
          git push origin HEAD:feat/v0.6-che-free-energy
