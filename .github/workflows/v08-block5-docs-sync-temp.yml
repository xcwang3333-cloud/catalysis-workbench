name: Temporary v0.8 Block 5 docs sync

on:
  push:
    branches:
      - docs/v08-block5-completion-sync
    paths:
      - .github/workflows/v08-block5-docs-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize central documents
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "v0.8 Blocks 1-4 are implemented on `main`",
              "v0.8 Blocks 1-5 are implemented on `main`",
          )
          replace_once(
              "README.md",
              "; XAS/XANES and XRD adapters remain later v0.8 blocks.",
              "; reviewed Block-5 XAS/XANES adapters now enforce explicit raw-versus-normalized mode separation and caller-window observed-maximum, adjacent-secant edge-position, and measured-point integral trajectories without hidden energy processing; XRD remains the final v0.8 implementation block.",
          )
          replace_once(
              "README.md",
              "Block 5 — operando XAS/XANES adapters, mapping, and explicit descriptor trajectories — is the next implementation work package.",
              "Block 5 completed through Issue #271 / PR #272: final exact head `a7fc080cd564191205dd8d8f8882b6e60e891ce5` passed CI #637 / run `32931971740` with Ruff, all 1177 tests, fresh-wheel Block-5 audit, and volumetric3d smoke; formal reviews `5026944037`, `5026945010` found no blockers with zero unresolved threads; expected-head squash merge produced `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`, and post-merge main CI #638 / run `32932720710` passed. Block 6 — operando XRD adapters, mapping, and explicit caller-window/peak trajectories — is the next and final scientific implementation work package.",
          )
          replace_once(
              "README.md",
              "Blocks 1-4 are complete, with two implementation blocks remaining and Block 5 XAS/XANES adapters, mapping, and explicit descriptor trajectories next.",
              "Blocks 1-5 are complete, with one implementation block remaining and Block 6 XRD adapters, mapping, and explicit caller-window/peak trajectories next.",
          )

          replace_once(
              "docs/MASTER_PLAN.md",
              "- Current verified scientific implementation head: `d46b57c5c558a06880e58d1b0bb15b6fd1c96a8c`, the expected-head squash merge of v0.8 Block 4 through Issue #267 / PR #268; post-merge CI #613 / run `32930335459` passed on that exact `main` head.",
              "- Current verified scientific implementation head: `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`, the expected-head squash merge of v0.8 Block 5 through Issue #271 / PR #272; post-merge CI #638 / run `32932720710` passed on that exact `main` head.",
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "- v0.8 Block 4 operando Raman/FTIR exact-grid adapters and explicit trajectories are complete through Issue #267 / PR #268 at merge `d46b57c5c558a06880e58d1b0bb15b6fd1c96a8c`; final exact head `45314c9c16c5460c8a9d574ec3fb43c6dfef722f` passed CI #612 / run `32930071404`; formal reviews `5026779773`, `5026780870` found no blockers with zero unresolved threads; post-merge main CI #613 / run `32930335459` passed. Block 5 — operando XAS/XANES adapters, mapping, and explicit descriptor trajectories — is next. No v0.7.1, tag, release, or package-registry action is implied.",
              "- v0.8 Block 4 operando Raman/FTIR exact-grid adapters and explicit trajectories are complete through Issue #267 / PR #268 at merge `d46b57c5c558a06880e58d1b0bb15b6fd1c96a8c`; final exact head `45314c9c16c5460c8a9d574ec3fb43c6dfef722f` passed CI #612 / run `32930071404`; formal reviews `5026779773`, `5026780870` found no blockers with zero unresolved threads; post-merge main CI #613 / run `32930335459` passed.\n- v0.8 Block 5 operando XAS/XANES raw-versus-normalized adapters and explicit descriptor trajectories are complete through Issue #271 / PR #272 at merge `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`; final exact head `a7fc080cd564191205dd8d8f8882b6e60e891ce5` passed CI #637 / run `32931971740` with Ruff, all 1177 tests, fresh-wheel Block-5 audit, and volumetric3d smoke; formal reviews `5026944037`, `5026945010` found no blockers with zero unresolved threads; post-merge main CI #638 / run `32932720710` passed. Block 6 — operando XRD adapters, mapping, and explicit caller-window/peak trajectories — is next. No v0.7.1, tag, release, or package-registry action is implied.",
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "| v0.8.x | operando/time-resolved analysis | architecture frozen; Blocks 1-4 complete; Block 5 XAS/XANES adapters, mapping, and descriptor trajectories next |",
              "| v0.8.x | operando/time-resolved analysis | architecture frozen; Blocks 1-5 complete; Block 6 XRD adapters, mapping, and caller-window/peak trajectories next |",
          )

          replace_once(
              "docs/ROADMAP.md",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Blocks 1-4 complete",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Blocks 1-5 complete",
          )
          replace_once(
              "docs/ROADMAP.md",
              "Block 4 is complete through Issue #267 / PR #268 at expected-head squash merge `d46b57c5c558a06880e58d1b0bb15b6fd1c96a8c`; final exact head `45314c9c16c5460c8a9d574ec3fb43c6dfef722f` passed CI #612 / run `32930071404`, formal reviews `5026779773`, `5026780870` found no blockers with zero unresolved threads, and post-merge main CI #613 / run `32930335459` passed.",
              "Block 4 is complete through Issue #267 / PR #268 at expected-head squash merge `d46b57c5c558a06880e58d1b0bb15b6fd1c96a8c`; final exact head `45314c9c16c5460c8a9d574ec3fb43c6dfef722f` passed CI #612 / run `32930071404`, formal reviews `5026779773`, `5026780870` found no blockers with zero unresolved threads, and post-merge main CI #613 / run `32930335459` passed. Block 5 is complete through Issue #271 / PR #272 at expected-head squash merge `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`; final exact head `a7fc080cd564191205dd8d8f8882b6e60e891ce5` passed CI #637 / run `32931971740`, formal reviews `5026944037`, `5026945010` found no blockers with zero unresolved threads, and post-merge main CI #638 / run `32932720710` passed.",
          )
          replace_once(
              "docs/ROADMAP.md",
              "5. Operando XAS/XANES adapters, mapping, and explicit descriptor trajectories.",
              "5. **Operando XAS/XANES adapters, mapping, and explicit descriptor trajectories — complete through #271 / #272.**\n   - reviewed raw-XAS and normalized-XANES adapters remain explicitly separated and fail closed on incompatible grid/reference/normalization state; white-line intensity uses an observed retained-point maximum, edge position uses the maximum adjacent measured-point secant under an explicit caller window, and window integration uses retained measured points with the numerical rule recorded; all trajectories reuse immutable `OperandoTrace` provenance and existing passive renderers; no hidden energy alignment, interpolation, resampling, smoothing, automatic fitting, species fraction, oxidation-state, LCF, or chemical assignment is introduced.",
          )
          replace_once(
              "docs/ROADMAP.md",
              "Block 5 — operando XAS/XANES adapters, mapping, and explicit descriptor trajectories — is the next implementation work package.",
              "Block 6 — operando XRD adapters, mapping, and caller-window/peak trajectories — is the next and final scientific implementation work package before v0.8 release gates.",
          )

          Path("docs/.v08-block5-sync").unlink()
          Path(".github/workflows/v08-block5-docs-sync-temp.yml").unlink()
      - name: Commit synchronized documentation
        run: |
          git config user.name "xiaochen wang"
          git config user.email "xcwang3333@gmail.com"
          git add README.md docs/MASTER_PLAN.md docs/ROADMAP.md docs/.v08-block5-sync .github/workflows/v08-block5-docs-sync-temp.yml
          git commit -m "docs: synchronize v0.8 Block 5 completion state"
          git push
