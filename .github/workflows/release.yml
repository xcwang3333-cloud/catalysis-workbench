name: Publish package to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish (for example v0.4.0)
        required: true
        type: string
      expected_sha:
        description: Exact commit SHA that the release tag must resolve to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate exact release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify exact tag target and package versions
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          expected_sha="$INPUT_EXPECTED_SHA"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable release tag: $tag" >&2
            exit 1
          fi

          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected SHA must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Required Git tag does not exist: $tag" >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/$tag")"

          if [[ "$tag_sha" != "$expected_sha" ]]; then
            echo "Tag target mismatch: expected $expected_sha, tag resolves to $tag_sha" >&2
            exit 1
          fi

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Checkout mismatch: expected $expected_sha, got $actual_sha" >&2
            exit 1
          fi

          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          runtime_version="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/catalysis_workbench/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\u0027]([^"\u0027]+)["\u0027]', text, re.MULTILINE)
          if match is None:
              raise SystemExit("Unable to read runtime __version__")
          print(match.group(1))
          PY
          )"

          if [[ "$tag" != "v${package_version}" ]]; then
            echo "Tag/version mismatch: $tag vs v${package_version}" >&2
            exit 1
          fi

          if [[ "$runtime_version" != "$package_version" ]]; then
            echo "Runtime/distribution version mismatch: $runtime_version vs $package_version" >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$actual_sha" >> "$GITHUB_ENV"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a fresh virtual environment
        run: |
          python -m venv .venv-publish
          .venv-publish/bin/python -m pip install --upgrade pip
          .venv-publish/bin/python -m pip install dist/catalysis_workbench-*.whl
          .venv-publish/bin/python -m pip check

      - name: Re-run installed public API and frozen v0.4 release audit
        run: |
          .venv-publish/bin/python tests/installed_api_smoke.py
          .venv-publish/bin/python tests/installed_thermal_smoke.py
          .venv-publish/bin/python tests/installed_sorption_smoke.py
          .venv-publish/bin/python tests/installed_composition_smoke.py
          CATALYSIS_WORKBENCH_EXPECTED_VERSION="$PACKAGE_VERSION" .venv-publish/bin/python tests/installed_v04_release_smoke.py

      - name: Run documented quickstarts from installed wheel
        run: |
          .venv-publish/bin/python examples/lsv_quickstart.py
          .venv-publish/bin/python examples/xrd_quickstart.py
          .venv-publish/bin/python examples/raman_quickstart.py
          .venv-publish/bin/python examples/ftir_quickstart.py
          .venv-publish/bin/python examples/thermal_quickstart.py
          .venv-publish/bin/python examples/sorption_quickstart.py
          .venv-publish/bin/python examples/composition_quickstart.py

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/catalysis-workbench
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
