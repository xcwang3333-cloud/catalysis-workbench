name: Temporary v0.8 Block 3 docs hygiene

on:
  push:
    branches: [docs/v08-block3-completion-sync]

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v08-block3-completion-sync
      - name: Correct superseded heatmap-groundwork wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": (
                  "Post-release Issue #245 / PR #246 added the backwards-compatible `symmetric_color_limits()` maintenance primitive as future v0.8 heatmap groundwork.",
                  "Post-release Issue #245 / PR #246 added the backwards-compatible `symmetric_color_limits()` maintenance primitive as v0.8 heatmap groundwork now consumed by Block 3.",
              ),
              "docs/MASTER_PLAN.md": (
                  "`symmetric_color_limits()` is backwards-compatible future v0.8 heatmap groundwork and is not a v0.8 data-model implementation.",
                  "`symmetric_color_limits()` is backwards-compatible v0.8 heatmap groundwork now consumed by Block 3 and is not itself a v0.8 data-model implementation.",
              ),
              "docs/ROADMAP.md": (
                  "the backwards-compatible `symmetric_color_limits()` maintenance primitive as future v0.8 heatmap groundwork without changing version, tag, release, or package-registry state.",
                  "the backwards-compatible `symmetric_color_limits()` maintenance primitive as v0.8 heatmap groundwork later consumed by Block 3 without changing version, tag, release, or package-registry state.",
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{filename}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/docs-v08-block3-hygiene-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MASTER_PLAN.md docs/ROADMAP.md .github/workflows/docs-v08-block3-hygiene-temp.yml
          git diff --cached --check
          git commit -m "docs: align Block 3 heatmap groundwork wording"
          git push
