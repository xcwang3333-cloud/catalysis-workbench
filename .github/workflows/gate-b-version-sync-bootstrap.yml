name: Gate B version sync bootstrap

on:
  push:
    branches: [release/v1.1.0-gate-b]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.0-gate-b
          fetch-depth: 0
      - name: Synchronize executable candidate version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = "1.1.0.dev0"
          new = "1.1.0"
          result = subprocess.run(
              ["git", "grep", "-l", old, "--", "pyproject.toml", "src", "tests"],
              text=True,
              capture_output=True,
              check=False,
          )
          paths = [Path(line) for line in result.stdout.splitlines() if line.strip()]
          if not paths:
              raise SystemExit("no executable/test version references found")
          for path in paths:
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old, new)
              if updated == text:
                  raise SystemExit(f"no replacement made in {path}")
              path.write_text(updated, encoding="utf-8")
          remaining = subprocess.run(
              ["git", "grep", "-n", old, "--", "pyproject.toml", "src", "tests"],
              text=True,
              capture_output=True,
              check=False,
          )
          if remaining.stdout.strip():
              raise SystemExit(remaining.stdout)
          print("updated", len(paths), "files")
          for path in paths:
              print(path)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src tests
          git commit -m "chore: finalize v1.1.0 executable version identity"
          git push origin HEAD:release/v1.1.0-gate-b