name: v0.8 Block 6 completion docs sync (temporary)

on:
  push:
    branches: [docs/v08-block6-completion-sync]
    paths:
      - '.github/workflows/docs-v08-block6-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v08-block6-completion-sync
          fetch-depth: 0
      - name: Synchronize central documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # README: public API, scientific scope, completion evidence, roadmap.
          replace_once(
              "README.md",
              "- `catalysis_workbench.experimental.operando`: immutable `FrameCoordinate` / `OperandoStack` state, `OperandoStackError`, exact-grid `build_operando_stack`, and reconstructible `series_array_digest`.",
              "- `catalysis_workbench.experimental.operando`: immutable frame-coordinate/stack/trace state; exact measured-point selection/cuts and explicit Pearson comparison; passive waterfall/heatmap/cut/trace rendering; reviewed Raman/FTIR, XAS/XANES, and XRD exact-grid adapters plus explicit caller-window and compatible fit-derived trajectories; all domain consumers retain reconstructible provenance and fail closed rather than aligning, interpolating, assigning chemistry/phases, or refitting implicitly.",
          )
          replace_once(
              "README.md",
              "- Operando/time-resolved: v0.8 Blocks 1-5 are implemented on `main`: the shared immutable frame-coordinate / exact-grid stack foundation, exact measured-point/derived-trace/cross-modal comparison layer, and passive waterfall/heatmap/cut/trace visualization are joined by reviewed Raman/FTIR exact-grid adapters and explicit caller-window band/peak plus caller-supplied fit-derived center/FWHM trajectories with fail-closed provenance/model compatibility; reviewed Block-5 XAS/XANES adapters now enforce explicit raw-versus-normalized mode separation and caller-window observed-maximum, adjacent-secant edge-position, and measured-point integral trajectories without hidden energy processing; XRD remains the final v0.8 implementation block.",
              "- Operando/time-resolved: all six v0.8 scientific blocks are implemented on `main`: immutable exact-grid frame/stack state; exact measured-point operations, derived traces, and explicit cross-modal Pearson comparison; passive waterfall/heatmap/cut/trace rendering; reviewed Raman/FTIR and XAS/XANES adapters with explicit caller-window/compatible fit-derived trajectories; and reviewed XRD exact-grid adapters with normalization-basis compatibility, measured-point window integral/unique observed-maximum position, and compatible caller-supplied fit center/FWHM consumers. No hidden alignment, interpolation/resampling, preprocessing, chemistry/species assignment, XRD phase inference, or refinement is introduced. Release Gate A is next and retains distribution/runtime version `0.7.0`.",
          )
          replace_once(
              "README.md",
              "Block 6 — operando XRD adapters, mapping, and explicit caller-window/peak trajectories — is the next and final scientific implementation work package.",
              "Block 6 completed through Issue #275 / PR #276: final exact head `6ddd7331363293593741dccb8b74ec9ed0dea3e2` passed CI #650 / run `32933715614` with Ruff, all 1186 tests, fresh-wheel Block-6 audit, and volumetric3d smoke; formal reviews `5027028638`, `5027030329` found no blockers with zero unresolved threads; expected-head squash merge produced `b5503ea7b48ca421d5ddf49e35b74f8f4e24791f`, and post-merge main CI #651 / run `32933955320` passed. All six v0.8 scientific implementation blocks are complete; release Gate A installed-wheel/public-API freeze/audit is next while version remains `0.7.0`.",
          )
          replace_once(
              "README.md",
              "- **v0.8:** architecture frozen for operando/time-resolved Raman/IR, XAS, and XRD stacks, waterfalls, heatmaps, descriptor trajectories, and explicit cross-modal correlation; Blocks 1-5 are complete, with one implementation block remaining and Block 6 XRD adapters, mapping, and explicit caller-window/peak trajectories next.",
              "- **v0.8:** architecture frozen for operando/time-resolved Raman/IR, XAS, and XRD stacks, waterfalls, heatmaps, descriptor trajectories, and explicit cross-modal correlation; Blocks 1-6 scientific implementation is complete, with release Gate A installed-wheel/public-API freeze/audit next while version remains `0.7.0`.",
          )

          # MASTER_PLAN: authoritative current head, Block-6 evidence, release map.
          replace_once(
              "docs/MASTER_PLAN.md",
              "- Current verified scientific implementation head: `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`, the expected-head squash merge of v0.8 Block 5 through Issue #271 / PR #272; post-merge CI #638 / run `32932720710` passed on that exact `main` head.",
              "- Current verified scientific implementation head: `b5503ea7b48ca421d5ddf49e35b74f8f4e24791f`, the expected-head squash merge of v0.8 Block 6 through Issue #275 / PR #276; post-merge CI #651 / run `32933955320` passed on that exact `main` head. All six v0.8 scientific implementation blocks are complete; release Gate A is next and retains distribution/runtime version `0.7.0`.",
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "- v0.8 Block 5 operando XAS/XANES raw-versus-normalized adapters and explicit descriptor trajectories are complete through Issue #271 / PR #272 at merge `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`; final exact head `a7fc080cd564191205dd8d8f8882b6e60e891ce5` passed CI #637 / run `32931971740` with Ruff, all 1177 tests, fresh-wheel Block-5 audit, and volumetric3d smoke; formal reviews `5026944037`, `5026945010` found no blockers with zero unresolved threads; post-merge main CI #638 / run `32932720710` passed. Block 6 — operando XRD adapters, mapping, and explicit caller-window/peak trajectories — is next. No v0.7.1, tag, release, or package-registry action is implied.",
              "- v0.8 Block 5 operando XAS/XANES raw-versus-normalized adapters and explicit descriptor trajectories are complete through Issue #271 / PR #272 at merge `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`; final exact head `a7fc080cd564191205dd8d8f8882b6e60e891ce5` passed CI #637 / run `32931971740` with Ruff, all 1177 tests, fresh-wheel Block-5 audit, and volumetric3d smoke; formal reviews `5026944037`, `5026945010` found no blockers with zero unresolved threads; post-merge main CI #638 / run `32932720710` passed.\n- v0.8 Block 6 operando XRD exact-grid adapters and explicit caller-window/peak trajectories are complete through Issue #275 / PR #276 at merge `b5503ea7b48ca421d5ddf49e35b74f8f4e24791f`; final exact head `6ddd7331363293593741dccb8b74ec9ed0dea3e2` passed CI #650 / run `32933715614` with Ruff, all 1186 tests, fresh-wheel Block-6 audit, and volumetric3d smoke; formal reviews `5027028638`, `5027030329` found no blockers with zero unresolved threads; post-merge main CI #651 / run `32933955320` passed. All six v0.8 scientific implementation blocks are complete; Gate A installed-wheel/public-API freeze/audit is next while version remains `0.7.0`. No v0.7.1, Gate-B version bump, tag, release, or package-registry action is implied.",
          )
          replace_once(
              "docs/MASTER_PLAN.md",
              "| v0.8.x | operando/time-resolved analysis | architecture frozen; Blocks 1-5 complete; Block 6 XRD adapters, mapping, and caller-window/peak trajectories next |",
              "| v0.8.x | operando/time-resolved analysis | architecture frozen; Blocks 1-6 scientific implementation complete; Gate A installed-wheel/public-API freeze/audit next at version 0.7.0 |",
          )

          # ROADMAP: final scientific block and release handoff.
          replace_once(
              "docs/ROADMAP.md",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Blocks 1-5 complete",
              "## v0.8.x — Operando and time-resolved data — architecture frozen; Blocks 1-6 scientific implementation complete",
          )
          replace_once(
              "docs/ROADMAP.md",
              "Block 5 is complete through Issue #271 / PR #272 at expected-head squash merge `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`; final exact head `a7fc080cd564191205dd8d8f8882b6e60e891ce5` passed CI #637 / run `32931971740`, formal reviews `5026944037`, `5026945010` found no blockers with zero unresolved threads, and post-merge main CI #638 / run `32932720710` passed.",
              "Block 5 is complete through Issue #271 / PR #272 at expected-head squash merge `b3aa8f59834f4c3fe5e4bffe94111b60ca360570`; final exact head `a7fc080cd564191205dd8d8f8882b6e60e891ce5` passed CI #637 / run `32931971740`, formal reviews `5026944037`, `5026945010` found no blockers with zero unresolved threads, and post-merge main CI #638 / run `32932720710` passed. Block 6 is complete through Issue #275 / PR #276 at expected-head squash merge `b5503ea7b48ca421d5ddf49e35b74f8f4e24791f`; final exact head `6ddd7331363293593741dccb8b74ec9ed0dea3e2` passed CI #650 / run `32933715614`, formal reviews `5027028638`, `5027030329` found no blockers with zero unresolved threads, and post-merge main CI #651 / run `32933955320` passed.",
          )
          replace_once(
              "docs/ROADMAP.md",
              "6. Operando XRD adapters, mapping, and caller-window/peak trajectories.",
              "6. **Operando XRD adapters, mapping, and caller-window/peak trajectories — complete through #275 / #276.**\n   - exact-grid XRD adapters preserve released strictly increasing 2theta semantics, literal source arrays/order, and compatible intensity/normalization basis; caller-window integral uses only retained measured points, observed peak position requires one unique retained maximum, and caller-supplied compatible `PeakFitResult` center/FWHM consumers reuse reviewed lmfit model conventions; heatmap/trace mapping reuses passive Block-3 renderers; no hidden normalization, interpolation/resampling, automatic peak fitting/discovery, phase identification/indexing/database matching, lattice/refinement/phase-fraction inference, or new dependency is introduced.",
          )
          replace_once(
              "docs/ROADMAP.md",
              "The frozen contract requires literal common grids, explicit coordinates/units/provenance, retained acquisition order, passive renderers, and fail-closed incompatibility. It performs no hidden alignment, interpolation, smoothing, baseline correction, normalization, chemical assignment, XAS species inference, XRD phase inference, or causal interpretation. Block 6 — operando XRD adapters, mapping, and caller-window/peak trajectories — is the next and final scientific implementation work package before v0.8 release gates.",
              "The frozen contract requires literal common grids, explicit coordinates/units/provenance, retained acquisition order, passive renderers, and fail-closed incompatibility. It performs no hidden alignment, interpolation, smoothing, baseline correction, normalization, chemical assignment, XAS species inference, XRD phase inference, or causal interpretation. All six scientific implementation blocks are complete. The next work package is v0.8 release Gate A: freeze and audit the full installed-wheel/public-API scope while distribution/runtime version remains `0.7.0`; Gate B version finalization, tagging, release publication, and package-registry publication are separate later decisions.",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm docs/.v08-block6-sync .github/workflows/docs-v08-block6-sync-temp.yml
          git add README.md docs/MASTER_PLAN.md docs/ROADMAP.md
          git diff --cached --check
          git commit -m "docs: record complete v0.8 scientific implementation"
          git push origin HEAD:docs/v08-block6-completion-sync
