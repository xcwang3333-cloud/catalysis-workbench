name: Temporary block-8 reporting fixer

on:
  push:
    branches:
      - feat/v0.6-free-energy-diagrams

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6-free-energy-diagrams
      - name: Split context and CHE source digests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/catalysis_workbench/computation/free_energy_diagram.py')
          text = path.read_text()
          old = '                "che_context_digest": None if context is None else context.che_source_digest,\n'
          new = (
              '                "diagram_context_digest": None if context is None else context.digest,\n'
              '                "che_source_digest": None if context is None else context.che_source_digest,\n'
          )
          if old not in text:
              raise SystemExit('free-energy diagram reporting target missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/catalysis_workbench/computation/free_energy_diagram.py
      - name: Commit exact reporting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalysis_workbench/computation/free_energy_diagram.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "api: distinguish diagram and CHE source digests"
          git push origin HEAD:feat/v0.6-free-energy-diagrams
