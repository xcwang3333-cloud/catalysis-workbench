name: Gate B docs sync

on:
  push:
    branches: [release/v1.1.0-gate-b]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.0-gate-b
          fetch-depth: 0
      - name: Apply release-status synchronization
        run: python scripts/gate_b_doc_sync.py
      - name: Commit synchronized documentation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/gate_b_doc_sync.py .github/workflows/gate-b-doc-sync.yml
          git add README.md CHANGELOG.md docs/MASTER_PLAN.md docs/ROADMAP.md docs/DESKTOP.md docs/V1_1_PLAN.md docs/V1_1_RELEASING.md docs/V1_1_RELEASE_NOTES_DRAFT.md
          git commit -m "docs: synchronize v1.1.0 Gate B candidate status"
          git push origin HEAD:release/v1.1.0-gate-b