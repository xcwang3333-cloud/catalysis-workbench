name: Windows Installer Publication Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/v11-installer-publication-readiness.yml"
      - "packaging/windows/verify_signed_artifact.ps1"
      - "docs/CODE_SIGNING_POLICY.md"
      - "docs/V1_1_INSTALLER.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-policy-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: v1.1.0
      RELEASE_SHA: 80da57c65bb70f599c1e068f6fe71a1551eaa856
      RELEASE_VERSION: 1.1.0
      INFRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact publication-infrastructure head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INFRA_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact infrastructure head and immutable release tag
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:INFRA_SHA) {
            throw "publication infrastructure drift: expected $env:INFRA_SHA, got $head"
          }
          git fetch --force --tags origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "release tag fetch failed" }
          $release = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($release -ne $env:RELEASE_SHA) {
            throw "release tag drift: expected $env:RELEASE_SHA, got $release"
          }

      - name: Validate code-signing policy contract
        shell: pwsh
        run: |
          $policy = Get-Content .\docs\CODE_SIGNING_POLICY.md -Raw
          $required = @(
            "Code signing policy",
            $env:RELEASE_TAG,
            $env:RELEASE_SHA,
            "CatalysisWorkbench-$env:RELEASE_VERSION-windows-x64-setup.exe",
            "RFC3161",
            "CatalysisWorkbench.exe",
            "unins*.exe",
            "separate explicit authorization"
          )
          foreach ($needle in $required) {
            if (-not $policy.Contains($needle)) {
              throw "code-signing policy is missing required contract text: $needle"
            }
          }

      - name: Exercise trusted Authenticode path and self-signed rejection
        shell: pwsh
        run: |
          $subject = "CN=CW Publication Gate Test"
          $probe = Join-Path $env:RUNNER_TEMP "trusted-probe.ps1"
          $cer = Join-Path $env:RUNNER_TEMP "cw-publication-gate-test.cer"
          Set-Content -LiteralPath $probe -Value "Write-Output 'publication gate probe'" -Encoding utf8

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddDays(1)
          try {
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
            $signed = Set-AuthenticodeSignature -FilePath $probe -Certificate $cert -HashAlgorithm SHA256
            if ($signed.Status -ne "Valid") {
              throw "test probe signing did not become trusted: $($signed.Status) $($signed.StatusMessage)"
            }

            .\packaging\windows\verify_signed_artifact.ps1 `
              -Path $probe `
              -ExpectedFileName "trusted-probe.ps1" `
              -PublisherSubjectRegex "CW Publication Gate Test" `
              -AllowSelfSignedTestCertificate | Out-File trusted-signature-probe.json -Encoding utf8

            $acceptedSelfSigned = $false
            try {
              .\packaging\windows\verify_signed_artifact.ps1 `
                -Path $probe `
                -ExpectedFileName "trusted-probe.ps1" `
                -PublisherSubjectRegex "CW Publication Gate Test" | Out-Null
              $acceptedSelfSigned = $true
            }
            catch {
              Write-Host "Expected public-mode self-signed rejection: $($_.Exception.Message)"
            }
            if ($acceptedSelfSigned) {
              throw "self-signed certificate was incorrectly accepted for publication"
            }

            $acceptedWrongPublisher = $false
            try {
              .\packaging\windows\verify_signed_artifact.ps1 `
                -Path $probe `
                -ExpectedFileName "trusted-probe.ps1" `
                -PublisherSubjectRegex "Definitely-Not-The-Test-Publisher" `
                -AllowSelfSignedTestCertificate | Out-Null
              $acceptedWrongPublisher = $true
            }
            catch {
              Write-Host "Expected signer mismatch rejection: $($_.Exception.Message)"
            }
            if ($acceptedWrongPublisher) {
              throw "unexpected publisher identity was incorrectly accepted"
            }
          }
          finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\Root\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }

      - name: Prove unsigned artifacts fail closed
        shell: pwsh
        run: |
          $unsigned = Join-Path $env:RUNNER_TEMP "unsigned.exe"
          Set-Content -LiteralPath $unsigned -Value "not a signed PE artifact" -Encoding ascii
          $accepted = $false
          try {
            .\packaging\windows\verify_signed_artifact.ps1 `
              -Path $unsigned `
              -ExpectedFileName "unsigned.exe" `
              -PublisherSubjectRegex ".*" | Out-Null
            $accepted = $true
          }
          catch {
            Write-Host "Expected fail-closed rejection: $($_.Exception.Message)"
          }
          if ($accepted) {
            throw "unsigned artifact was incorrectly accepted"
          }

      - name: Confirm publication workflow remains read-only
        shell: pwsh
        run: |
          $workflow = Get-Content .\.github\workflows\v11-installer-publication-readiness.yml -Raw
          if ($workflow -match "contents:\s*write") {
            throw "publication-readiness workflow must not have contents: write"
          }
          if ($workflow -match "releases/.+assets" -or $workflow -match "upload-release-asset") {
            throw "publication-readiness workflow must not mutate GitHub Releases"
          }
