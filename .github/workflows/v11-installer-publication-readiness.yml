name: Windows Installer Publication Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/v11-installer-publication-readiness.yml"
      - "packaging/windows/verify_signed_artifact.ps1"
      - "docs/CODE_SIGNING_POLICY.md"
      - "docs/V1_1_INSTALLER.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-policy-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: v1.1.0
      RELEASE_SHA: 80da57c65bb70f599c1e068f6fe71a1551eaa856
      RELEASE_VERSION: 1.1.0
      INFRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact publication-infrastructure head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INFRA_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact infrastructure head and immutable release tag
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:INFRA_SHA) {
            throw "publication infrastructure drift: expected $env:INFRA_SHA, got $head"
          }
          git fetch --force --tags origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "release tag fetch failed" }
          $release = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($release -ne $env:RELEASE_SHA) {
            throw "release tag drift: expected $env:RELEASE_SHA, got $release"
          }

      - name: Validate code-signing policy contract
        shell: pwsh
        run: |
          $policy = Get-Content .\docs\CODE_SIGNING_POLICY.md -Raw
          $required = @(
            "Code signing policy",
            $env:RELEASE_TAG,
            $env:RELEASE_SHA,
            "CatalysisWorkbench-$env:RELEASE_VERSION-windows-x64-setup.exe",
            "RFC3161",
            "CatalysisWorkbench.exe",
            "unins*.exe",
            "separate explicit authorization"
          )
          foreach ($needle in $required) {
            if (-not $policy.Contains($needle)) {
              throw "code-signing policy is missing required contract text: $needle"
            }
          }

      - name: Exercise trusted Authenticode verification path
        shell: pwsh
        run: |
          $probe = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          .\packaging\windows\verify_signed_artifact.ps1 `
            -Path $probe `
            -ExpectedFileName "powershell.exe" `
            -PublisherSubjectRegex "Microsoft" | Out-File trusted-signature-probe.json -Encoding utf8

      - name: Prove unsigned artifacts fail closed
        shell: pwsh
        run: |
          $unsigned = Join-Path $env:RUNNER_TEMP "unsigned.exe"
          Set-Content -LiteralPath $unsigned -Value "not a signed PE artifact" -Encoding ascii
          $accepted = $false
          try {
            .\packaging\windows\verify_signed_artifact.ps1 `
              -Path $unsigned `
              -ExpectedFileName "unsigned.exe" `
              -PublisherSubjectRegex ".*" | Out-Null
            $accepted = $true
          }
          catch {
            Write-Host "Expected fail-closed rejection: $($_.Exception.Message)"
          }
          if ($accepted) {
            throw "unsigned artifact was incorrectly accepted"
          }

      - name: Prove signer mismatch fails closed
        shell: pwsh
        run: |
          $probe = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $accepted = $false
          try {
            .\packaging\windows\verify_signed_artifact.ps1 `
              -Path $probe `
              -ExpectedFileName "powershell.exe" `
              -PublisherSubjectRegex "Definitely-Not-The-Microsoft-Publisher" | Out-Null
            $accepted = $true
          }
          catch {
            Write-Host "Expected signer mismatch rejection: $($_.Exception.Message)"
          }
          if ($accepted) {
            throw "unexpected publisher identity was incorrectly accepted"
          }

      - name: Confirm publication workflow remains read-only
        shell: pwsh
        run: |
          $workflow = Get-Content .\.github\workflows\v11-installer-publication-readiness.yml -Raw
          if ($workflow -match "contents:\s*write") {
            throw "publication-readiness workflow must not have contents: write"
          }
          if ($workflow -match "releases/.+assets" -or $workflow -match "upload-release-asset") {
            throw "publication-readiness workflow must not mutate GitHub Releases"
          }
