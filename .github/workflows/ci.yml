name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel in a fresh virtual environment
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install dist/catalysis_workbench-*.whl
          .venv-smoke/bin/python -m pip check

      - name: Audit installed public API and cumulative v0.7/v0.8/v0.9/v1.0 scope
        run: |
          .venv-smoke/bin/python tests/installed_api_smoke.py
          .venv-smoke/bin/python tests/installed_color_scales_smoke.py
          .venv-smoke/bin/python tests/installed_thermal_smoke.py
          .venv-smoke/bin/python tests/installed_sorption_smoke.py
          .venv-smoke/bin/python tests/installed_composition_smoke.py
          CATALYSIS_WORKBENCH_EXPECTED_VERSION=1.0.0.dev0 .venv-smoke/bin/python tests/installed_v07_release_smoke.py
          .venv-smoke/bin/python tests/installed_v08_block1_smoke.py
          .venv-smoke/bin/python tests/installed_v08_block2_smoke.py
          .venv-smoke/bin/python tests/installed_v08_block3_smoke.py
          .venv-smoke/bin/python tests/installed_v08_block4_smoke.py
          .venv-smoke/bin/python tests/installed_v08_block5_smoke.py
          .venv-smoke/bin/python tests/installed_v08_block6_smoke.py
          .venv-smoke/bin/python tests/installed_v09_smoke.py
          .venv-smoke/bin/python tests/installed_v09_block5_smoke.py
          .venv-smoke/bin/python tests/installed_v09_block6_smoke.py
          .venv-smoke/bin/python tests/installed_v10_block1_smoke.py
          .venv-smoke/bin/python tests/installed_v10_block2_smoke.py
          .venv-smoke/bin/python tests/installed_v10_block3_smoke.py
          .venv-smoke/bin/python tests/installed_v10_block4_smoke.py

      - name: Audit installed structure/electronic/bonding/ELFCAR/band/PROCAR/LOCPOT adapters
        run: |
          python -m venv .venv-structure
          .venv-structure/bin/python -m pip install --upgrade pip
          wheel_path="$(realpath "$(ls dist/catalysis_workbench-*.whl)")"
          .venv-structure/bin/python -m pip install "catalysis-workbench[structure] @ file://${wheel_path}"
          .venv-structure/bin/python -m pip check
          .venv-structure/bin/python tests/installed_structure_smoke.py
          .venv-structure/bin/python tests/installed_electronic_structure_smoke.py
          .venv-structure/bin/python tests/installed_bonding_smoke.py
          .venv-structure/bin/python tests/installed_elf_smoke.py
          .venv-structure/bin/python tests/installed_band_structure_smoke.py
          .venv-structure/bin/python tests/installed_procar_smoke.py
          .venv-structure/bin/python tests/installed_locpot_smoke.py

      - name: Run documented LSV/XRD/Raman/FTIR/thermal/sorption/composition examples from installed wheel
        run: |
          .venv-smoke/bin/python examples/lsv_quickstart.py
          .venv-smoke/bin/python examples/xrd_quickstart.py
          .venv-smoke/bin/python examples/raman_quickstart.py
          .venv-smoke/bin/python examples/ftir_quickstart.py
          .venv-smoke/bin/python examples/thermal_quickstart.py
          .venv-smoke/bin/python examples/sorption_quickstart.py
          .venv-smoke/bin/python examples/composition_quickstart.py

  volumetric3d-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install VTK headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libgl1 libegl1 libxrender1

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel with optional volumetric3d backend
        run: |
          python -m venv .venv-volumetric3d
          .venv-volumetric3d/bin/python -m pip install --upgrade pip
          wheel_path="$(realpath "$(ls dist/catalysis_workbench-*.whl)")"
          .venv-volumetric3d/bin/python -m pip install "catalysis-workbench[volumetric3d] @ file://${wheel_path}"
          .venv-volumetric3d/bin/python -m pip check

      - name: Audit installed headless skew-cell 3D rendering and PNG export
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: .venv-volumetric3d/bin/python tests/installed_volumetric3d_smoke.py
